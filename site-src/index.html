<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{TAGLINE}}">
<meta property="og:type" content="website"><meta property="og:title" content="{{TITLE}}"><meta property="og:description" content="{{TAGLINE}}">
<meta property="og:image" content="{{SITE}}media/social.png"><meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{{HERE}}"><meta property="og:url" content="{{HERE}}">
<link rel="alternate" hreflang="en" href="{{SITE}}">
<link rel="alternate" hreflang="x-default" href="{{SITE}}">
<link rel="alternate" hreflang="fr" href="{{SITE}}fr/">
<link rel="alternate" type="application/atom+xml" title="{{FEEDTITLE}}" href="{{SITE}}{{FEEDPATH}}feed.xml">
<link rel="alternate" type="text/markdown" title="{{MDTITLE}}" href="{{HERE}}index.md">
<link rel="alternate" type="application/json" href="{{SITE}}data.json">
<link rel="describedby" type="text/plain" href="{{SITE}}llms.txt">
<script type="application/ld+json">{{LD}}</script>
<link rel="icon" type="image/svg+xml" href="{{ROOT}}media/logo.svg">
<link rel="icon" type="image/png" sizes="64x64" href="{{ROOT}}media/favicon.png">
<link rel="apple-touch-icon" href="{{ROOT}}media/apple-touch-icon.png">
<script>/* language: the English home page sends a French-speaking browser to /fr/, unless a language was chosen with the button */
try{if('{{LANG}}'==='en'){const l=localStorage.getItem('lang');if(l==='fr'||(!l&&/^fr\b/i.test((navigator.languages||[navigator.language])[0]||'')))location.replace('fr/'+location.search+location.hash)}}catch(e){}</script>
<script>setTimeout(()=>document.documentElement.classList.add('ready'),3000);try{const t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
{{STYLE}}
</style>
<noscript><style>html:not(.ready) #view-dir>*,html:not(.ready) footer{visibility:visible!important}</style></noscript>
</head>
<body>
<a class="skip" href="#q" id="skip" data-t="skip"></a>
{{HEADER}}
<main class="wrap" id="top" data-add="https://github.com/{{REPO}}/issues/new?template=add-resource.yml">
<div id="view-dir">
<section class="hero"><div><h1>{{TITLE}}</h1><p>{{TAGLINE}}</p><p class="fresh" id="fresh"></p></div><div class="kpis" id="kpis"></div></section>
<h2 id="directory" data-t="nav_dir"></h2>
<div class="bar">
<div class="row"><span class="qbox"><input type="search" id="q" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugg"><div id="sugg" role="listbox" hidden></div></span><span class="count" id="count" role="status"></span><button type="button" class="fsum" id="fsum" hidden></button><span class="seg" role="group" id="viewsw"><button type="button" data-v="cards" data-t="v_cards"></button><button type="button" data-v="table" data-t="v_table"></button></span><span class="acts"><button class="btn" id="ftoggle" type="button" aria-expanded="false" aria-controls="fams"></button><button class="btn" id="reset" type="button" data-t-label="reset"><span class="rl" data-t="reset"></span><span class="rs" data-t="reset_short"></span></button></span></div>
<div id="fams">
<div class="fam"><span class="label" data-t="f_cat"></span><div class="chips" id="f-cat"></div></div>
<div class="fam cov"><span class="label" data-t="f_cov"></span><div class="chips" id="f-cov"></div></div>
<div class="fam opt"><span class="label" data-t="f_opt"></span><div class="chips" id="f-misc"></div></div>
</div></div>
<div id="barsp" aria-hidden="true"></div>
<div id="intro">
<h2 id="start" data-t="start"></h2><div class="journeys" id="journeys"></div><details class="mapd" id="startd" open><summary></summary></details>
<details class="mapd" id="mapd"><summary><h2 id="map" data-t="map"></h2></summary><div class="map" id="mapgrid"></div><div class="key" id="mapkey"></div></details>
<h2 id="all" data-t="all_res" hidden></h2>
</div>
<div id="list"></div>
<noscript><p><span data-t="nojs"></span> <a href="{{HOME}}index.md" type="text/markdown" data-t="as_text"></a> · <a href="{{ROOT}}data.json" type="application/json" data-t="as_json"></a></p></noscript>
</div>
</div>
<div id="view-obs" hidden><h1 class="vh" data-t="nav_obs"></h1>
<h2 data-t="part_out"></h2>
<div class="insights"><section class="panel wide" id="v-passion"></section><section class="panel wide" id="v-makers"></section></div>
<h2 data-t="part_in"></h2>
<div class="insights"><section class="panel" id="v-pulse"></section><section class="panel" id="v-brands"></section></div>
</div>
</main>
<button type="button" id="totop" class="btn totop" hidden></button>
{{FOOTER}}
<div id="tip" aria-hidden="true"></div>
<script>/* MiniSearch 7.2.0, MIT licence, see site-src/vendor/minisearch-LICENSE.txt */
{{MINISEARCH}}</script>
<script id="data" type="application/json">{{DATA}}</script>
<script>
{{HEADERJS}}
</script>
<script>
{{APP}}
</script>
</body>
</html>
