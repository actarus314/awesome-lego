name: Links
on:
  schedule:
    - cron: "23 5 * * 3"   # weekly
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 401 and 403: a bot check in front of a public page; 405: an endpoint that answers only another method (an MCP server)
      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 3 --timeout 30 --accept 200..=299,401,403,405,429 --exclude-loopback --exclude-path site 'data/*.toml' README.md contributing.md MAINTENANCE.md
          output: lychee-report.md
          fail: false
      - name: Open, update or close the links issue   # one issue, kept up to date, closed when every link answers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ steps.lychee.outputs.exit_code != 0 }}
        run: |
          n=$(gh issue list --label links --state open --json number -q '.[0].number')
          if [ "$FAILED" = "true" ] && [ -f lychee-report.md ]; then
            head -c 60000 lychee-report.md > body.md   # an issue body holds 65536 characters at most
            if [ -n "$n" ]; then gh issue edit "$n" --body-file body.md; else gh issue create --title "Broken links" --label links --label automatic --body-file body.md; fi
          elif [ "$FAILED" != "true" ] && [ -n "$n" ]; then gh issue close "$n" --comment "Every link answers again."; fi   # a run without a report closes nothing
