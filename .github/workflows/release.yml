name: Release
on:
  push:
    branches: [main]
    paths: [VERSION, CHANGELOG.md]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  queue: max   # each push of a version tags its own commit: a dropped run would leave a version without its tag
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # about 10 seconds
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag and GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$v" >/dev/null 2>&1; then echo "$v already released"; exit 0; fi
          python3 scripts/release_notes.py section "$v" > notes.md
          gh release create "$v" --target "$GITHUB_SHA" --title "$v" --notes-file notes.md
      # Releases are immutable, their notes are not: each one follows its CHANGELOG.md section when that section is rewritten.
      - name: Notes of earlier releases follow CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate --slurp > releases.json
          for tag in $(python3 scripts/release_notes.py stale releases.json notes); do
            gh release edit "$tag" --notes-file "notes/$tag.md"
            echo "notes of $tag: from CHANGELOG.md"
          done
