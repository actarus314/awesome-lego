name: Data fixes
on:
  workflow_run:   # the same morning as the links issue: when the weekly Links run ends, whatever its conclusion
    workflows: [Links]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: data-fixes
  cancel-in-progress: false
jobs:
  fixes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Find mechanical fixes (addresses moved for good, past event dates)
        run: python3 scripts/autofix.py --write > fixes.md
      - name: Rebuild the generated files and check them
        run: python3 scripts/build.py && python3 scripts/build.py --check
      # A pull request opened with the token of Actions waits for "Approve and run workflows" before its checks.
      # A GitHub App token (client ID in the variable DATA_FIXES_APP_ID, private key in the secret DATA_FIXES_APP_KEY)
      # or a personal token (secret DATA_FIXES_TOKEN) lets Check and Render start on their own.
      - id: app
        if: vars.DATA_FIXES_APP_ID != ''
        uses: actions/create-github-app-token@305e4aec4e2000ce216527e282f0749f47637923 # v3.4.0
        with:
          client-id: ${{ vars.DATA_FIXES_APP_ID }}
          private-key: ${{ secrets.DATA_FIXES_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.DATA_FIXES_TOKEN || secrets.GITHUB_TOKEN }}
          OWN_TOKEN: ${{ steps.app.outputs.token != '' || secrets.DATA_FIXES_TOKEN != '' }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- data README.md full-list.md; then echo "Nothing to fix."; exit 0; fi
          [ "$OWN_TOKEN" = "true" ] || echo "::warning::No app or personal token: the checks of the pull request wait for Approve and run workflows"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B auto/data-fixes
          git add data README.md full-list.md
          git commit -qm "Data fixes: addresses moved for good, past event dates"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" auto/data-fixes
          printf '%s\n\n%s\n' "Mechanical fixes found by scripts/autofix.py. Each line is checked by a person before merging." "$(cat fixes.md)" > body.md
          n=$(gh pr list --head auto/data-fixes --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh pr edit "$n" --body-file body.md; else gh pr create --head auto/data-fixes --base main --title "Data fixes" --label automatic --body-file body.md; fi
