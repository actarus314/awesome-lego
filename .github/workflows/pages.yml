name: Pages
on:
  push:
    branches: [main]
    paths: [VERSION]   # what goes online is a version: the commit Version writes on main right after a merge
  schedule:
    - cron: "17 4 * * *"   # daily: fresh activity data and statuses
  workflow_dispatch:
    inputs:
      previews:
        description: "Only publish the previews again (measurements of the published website reused, none kept)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages   # one deployment at a time, in the order started: each run builds the version main holds when it starts,
  queue: max      # so a later run is never older; none is dropped (the daily run keeps its measurements)
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # about 30 seconds, 4 minutes when the activity data is read again
    permissions:
      contents: read   # the job that reads outside feeds cannot write to the repository
      actions: read    # to fetch the previews built by the last successful Preview run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the history back to the commit of the version (about 10 MB)
      # Online is always a version: the commit of main that last changed VERSION, the one Version wrote and Release tags
      # (without waiting for the tag), so a merge Version has not numbered yet never goes out
      - name: The version online
        run: |
          c=$(git log -1 --format=%H -- VERSION)
          git checkout -q --detach "$c"; echo "Website of v$(tr -d '[:space:]' < VERSION) (commit ${c:0:7})"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Read activity data (GitHub, YouTube, Reddit, feeds)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSE: ${{ (github.event_name == 'push' || inputs.previews) && '--from-site' || '' }}
        run: python3 scripts/refresh.py $REUSE   # after a push, the measurements of the published website are reused (read daily)
      - name: Keep the day's measurements for the "history" job
        if: github.event_name != 'push' && !inputs.previews   # the daily run, or a full reading started by hand
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metrics
          path: data/metrics.json
          retention-days: 3
      - run: python3 scripts/build.py --site-only
      - name: Previews under preview/, as built by the last successful Preview run (no branch code runs here)
        continue-on-error: true   # without previews, the website is still published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          # the newest artifact "previews" of a run on a branch of this repository (never a fork's), not the newest run: a run
          # whose jobs were all skipped succeeds without any; sorted here, the API does not list them newest first (27/11/2026)
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=previews&per_page=100" --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == (env.REPO_ID | tonumber))] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -z "$id" ]; then echo "No previews built: none published."; exit 0; fi
          gh run download "$id" --repo "$GITHUB_REPOSITORY" --name previews --dir site/preview
          find site/preview -type l -delete   # never a link in the published files
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  history:
    needs: build
    if: github.event_name != 'push' && !inputs.previews
    runs-on: ubuntu-latest
    timeout-minutes: 5   # about 10 seconds
    permissions:
      contents: write   # the only job that can write to the repository; its steps push to the "history" branch and nowhere else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: metrics
      - name: Keep the day's measurements on the "history" branch (trends, never shown as such)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          day=$(date -u +%F); d=$(mktemp -d); remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q "$d" && cd "$d"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code "$remote" history >/dev/null; then git fetch -q --depth=1 "$remote" history && git checkout -q -b history FETCH_HEAD
          else git checkout -q --orphan history; fi
          mkdir -p metrics && cp "$GITHUB_WORKSPACE/metrics.json" "metrics/$day.json"
          git add metrics
          if git diff --cached --quiet; then echo "Measurements of $day already kept."; exit 0; fi   # a rerun of the same day
          git commit -qm "Measurements $day" && git push -q "$remote" HEAD:history   # a failed push fails the job: a missing day is seen
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10   # about 30 seconds; the deployment itself gives up after 10 minutes
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
