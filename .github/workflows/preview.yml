name: Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # what changes the website; a closed request matches when it changed one of these, the only case with a preview to remove
    paths: ["site-src/**", "scripts/build.py", "scripts/previews.py", "media/**", "!media/site-preview*.png", "data/**", "changes/**", "VERSION", "CHANGELOG.md", ".github/workflows/preview.yml"]
  push:
    branches: [main]   # each preview is the pull request merged with main: rebuilt when main moves
    paths: ["site-src/**", "scripts/build.py", "scripts/previews.py", "media/**", "!media/site-preview*.png", "data/**", "changes/**", "VERSION", "CHANGELOG.md", ".github/workflows/preview.yml"]   # the same list as above
permissions: {}
jobs:
  build:
    # branches of this repository only (people, Data fixes, Renovate, Tidy), never a fork; a merged pull request is rebuilt
    # by the run of its push to main (same files), not a second time by its closing
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.merged)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: preview-build   # each run builds every preview from main as it is when it starts: one at a time, none
      queue: max             # dropped (a cancelled run on main would read as a failure)
    permissions:
      contents: read        # the code of the pull request runs here: this job can write nowhere and publishes nothing
      pull-requests: read   # to list the open pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Measurements of the published website
        continue-on-error: true   # without them, the branches build with the repository's copy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh.py --from-site
      - name: Website of each open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # read-only, seen by previews.py (the pull request's own); the build of each branch runs without it
        run: python3 scripts/previews.py previews
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previews
          path: previews
          retention-days: 30   # the Pages runs of the following days publish the same previews
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5   # one call, a few seconds
    permissions:
      actions: write   # to start the Pages workflow of main, the only one allowed to publish
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f previews=true
  link:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5   # one comment, a few seconds
    permissions:
      pull-requests: write   # one comment with the link, kept up to date
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}   # main's scripts only: nothing of the pull request runs here
          sparse-checkout: |
            scripts/build.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          pages=$(sed -n 's/^PAGES = "\([^"]*\)".*/\1/p' scripts/build.py)   # the address of the website (tests/test_build.py checks this reading)
          [ -n "$pages" ] || { echo "PAGES not found in scripts/build.py"; exit 1; }
          url="${pages}preview/${N}/"
          if [ "$ACTION" = closed ]; then body="<!-- preview -->
          Preview removed: the pull request is closed."
          else
          body="<!-- preview -->
          **Preview of this pull request**: ${url} (French: ${url}fr/); each earlier commit that changes the website: ${url}c/

          Commit ${SHA:0:7}, merged with \`main\` (alone if they conflict), online a few minutes after this comment (the **Preview** run, then the **Pages** run it starts). The banner of each page gives the number its merge gives, and the website its changelog entry, as Version will write them; rebuilt each time \`main\` moves, hidden from search engines, removed when the pull request is closed."
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- preview -->"))) | .id' | head -n1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$N/comments" -f body="$body" >/dev/null; fi
