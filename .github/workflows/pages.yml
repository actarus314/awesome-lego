name: Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"   # daily: fresh activity data and statuses
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # the job that reads outside feeds cannot write to the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Read activity data (GitHub, YouTube, Reddit, feeds)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh.py
      - name: Keep the day's measurements for the "history" job
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metrics
          path: data/metrics.json
          retention-days: 3
      - run: python3 scripts/build.py --site-only
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  history:
    needs: build
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that can write to the repository; its steps push to the "history" branch and nowhere else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: metrics
      - name: Keep the day's measurements on the "history" branch (trends, never shown as such)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          day=$(date -u +%F); d=$(mktemp -d); remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q "$d" && cd "$d"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code "$remote" history >/dev/null; then git fetch -q --depth=1 "$remote" history && git checkout -q -b history FETCH_HEAD
          else git checkout -q --orphan history; fi
          mkdir -p metrics && cp "$GITHUB_WORKSPACE/metrics.json" "metrics/$day.json"
          git add metrics && (git commit -qm "Measurements $day" && git push -q "$remote" HEAD:history || true)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
