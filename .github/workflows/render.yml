name: Render
on:
  pull_request:
    paths: ["site-src/**", "scripts/build.py", "scripts/check_site.py", "media/**", "!media/site-preview*.png", "data/**", "tests/render-fixture.html", "tests/requirements.txt", "package-lock.json", ".github/workflows/render.yml"]   # the README image alone changes nothing on the website
  push:
    branches: [main]
    paths: ["site-src/**", "scripts/build.py", "scripts/check_site.py", "media/**", "!media/site-preview*.png", "data/**", "tests/render-fixture.html", "tests/requirements.txt", "package-lock.json", ".github/workflows/render.yml"]   # the README image alone changes nothing on the website
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read   # the list of changed files, read by the step "What changed"
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:   # not a required check: a path filter would leave a required check pending
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"   # the browser library ships wheels for released Pythons first
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - name: Tools (axe-core from package-lock.json, Playwright and Chromium)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install --quiet --require-hashes -r tests/requirements.txt
          python3 -m playwright install --with-deps chromium
      - run: python3 scripts/build.py --site-only
      - name: What changed (a pull request that changes data alone gets the lighter pass)
        id: scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # data and the files generated from it only: layout at 1440, 390 and 320 px in the light theme, no accessibility pass;
          # anything else, or a list that cannot be read: every check
          if files=$(gh pr diff "$PR" --name-only) && [ -n "$files" ] \
             && ! grep -qvE '^(data/|README\.md$|full-list\.md$|CHANGELOG\.md$|VERSION$|\.github/ISSUE_TEMPLATE/|media/site-preview)' <<< "$files"; then
            echo "mode=--data-only" >> "$GITHUB_OUTPUT"
          fi
      - name: Rendering checks (every view at five widths and both themes, accessibility with axe-core; data alone, see above)
        env:
          MODE: ${{ steps.scope.outputs.mode }}
        run: python3 scripts/check_site.py --json render.json ${MODE:+"$MODE"}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-findings
          path: render.json
          retention-days: 7
