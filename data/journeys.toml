# "Where to start": one ranked list per need. The website keeps, in this order, the first 5 that suit the visitor:
# scope "country": international entries and those of the visitor's country (from the browser; for France, also shops that deliver there);
# scope "language": entries in the visitor's language or in English; scope "global": all. `always`: shown whatever the visitor.

[[journey]]
id = "buy"
title_en = "Buy a set, official LEGO or alternative"
title_fr = "Acheter un set, LEGO officiel ou alternative"
scope = "country"
resources = ["brick-broker", "brickmitri", "lego-com-fr", "brickmerge", "ltoys", "kbs-shop", "bluebrixx-shop", "baustein-store", "bricksdeal", "promoklocki", "brickzone-dk", "prisjakt-se", "brickitalia", "brickturtle", "lego-price-tracker-nz", "brickfact", "lakea", "cobi-europe"]

