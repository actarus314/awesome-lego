name: Add a resource
description: Suggest a website, shop, brand, channel, community, event, place, club or tool
title: "Add: "
labels: ["new resource"]
body:
  - type: input
    id: url
    attributes:
      label: Address
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Brands and manufacturers
        - Shops
        - Price comparators and databases
        - Second-hand, parts and accessories
        - Communities and news
        - YouTube and podcasts
        - Events
        - Places to visit
        - Clubs and associations
        - Learning
        - Tools and APIs
        - Other directories and lists
    validations:
      required: true
  - type: dropdown
    id: audience
    attributes:
      label: Public
      description: Only when the resource itself states it (an age range, a junior section, adult fans only)
      options:
        - No particular public
        - Made for children or families, or with a stated offer for them
        - Made for adults, or for adults only
        - Both, with an offer for each
    validations:
      required: false
  - type: textarea
    id: why
    attributes:
      label: What it is and why it belongs here
      description: In English. Facts, with a link that supports them
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Not already in the list
          required: true
        - label: No affiliate or referral link
          required: true
