name: Data report
on:
  schedule:
    - cron: "41 3 * * 1"   # weekly
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Read activity data and write the report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/refresh.py > report.md
          echo >> report.md
          python3 scripts/trends.py >> report.md || echo "Trends: the history branch could not be read this week." >> report.md   # never loses the rest of the report
      - name: Open or update the report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=$(gh issue list --label automatic --state open --search "Weekly data report in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file report.md; else gh issue create --title "Weekly data report" --label automatic --body-file report.md; fi
