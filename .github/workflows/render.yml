name: Render
on:
  pull_request:
    paths: ["site-src/**", "scripts/build.py", "scripts/check_site.py", "media/**", "!media/site-preview*.png", "data/**", "tests/render-fixture.html", "tests/phone-fixture.html", "tests/css-states.txt", "tests/requirements.txt", "package-lock.json", ".github/workflows/render.yml"]   # the README image alone changes nothing on the website
  push:
    branches: [main]
    paths: ["site-src/**", "scripts/build.py", "scripts/check_site.py", "media/**", "!media/site-preview*.png", "data/**", "tests/render-fixture.html", "tests/phone-fixture.html", "tests/css-states.txt", "tests/requirements.txt", "package-lock.json", ".github/workflows/render.yml"]   # the README image alone changes nothing on the website
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read   # the list of changed files, read by the step "What changed"
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:   # not a required check: a path filter would leave a required check pending
    runs-on: ubuntu-latest
    timeout-minutes: 20   # about 1.5 minutes in all, 10 on the slowest runs before the fonts were kept
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"   # the browser library ships wheels for released Pythons first
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - name: Runner image and week (key of the fonts kept between runs)
        id: week
        run: |
          echo "prefix=fonts-${ImageOS:-linux}-" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # the fonts that Playwright installs for Chromium (21.9 MB) came at 60 kB/s from the Ubuntu mirror on some runs, up to 6 minutes:
      # their packages are kept between runs; apt checks each kept package against its signed index and downloads only what is missing or newer
      - name: Fonts kept by an earlier run
        id: fonts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/fonts
          key: ${{ steps.week.outputs.prefix }}${{ steps.week.outputs.week }}-${{ hashFiles('tests/requirements.txt') }}
          restore-keys: ${{ steps.week.outputs.prefix }}
      - name: Tools (axe-core from package-lock.json, Playwright, Chromium and its fonts)
        id: tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r tests/requirements.txt
          if compgen -G "$HOME/fonts/*.deb" > /dev/null; then sudo cp "$HOME"/fonts/*.deb /var/cache/apt/archives/; fi
          python3 -m playwright install --with-deps chromium
          # kept for the next runs: the packages of the versions now installed, and no others (older ones would pile up week after week)
          rm -rf "$HOME/fonts" && mkdir "$HOME/fonts"
          for f in /var/cache/apt/archives/*.deb; do
            [ -e "$f" ] || continue
            pkg=$(dpkg-deb -f "$f" Package) ver=$(dpkg-deb -f "$f" Version)
            if [ "$(dpkg-query -W -f='${Version}' "$pkg" 2>/dev/null)" = "$ver" ]; then cp "$f" "$HOME/fonts/"; fi
          done
          ls "$HOME/fonts"
          echo "kept=$(find "$HOME/fonts" -name '*.deb' | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Keep the fonts for the next runs (from main only, once a week or when tests/requirements.txt changes)
        if: github.ref == 'refs/heads/main' && steps.fonts.outputs.cache-hit != 'true' && steps.tools.outputs.kept != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/fonts
          key: ${{ steps.week.outputs.prefix }}${{ steps.week.outputs.week }}-${{ hashFiles('tests/requirements.txt') }}
      - name: Measurements of the published website (stars, last activity), so that the cards are drawn as published; none if it cannot be read
        run: python3 scripts/refresh.py --from-site-only   # reads no other site; data/metrics.json is not kept in git
      - run: python3 scripts/build.py --site-only
      - name: What changed (a pull request that changes data alone gets the lighter pass)
        id: scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # data and the files generated from it only: layout at 1440, 390 and 320 px in the light theme, no accessibility pass;
          # anything else, or a list that cannot be read: every check
          if files=$(gh pr diff "$PR" --name-only) && [ -n "$files" ] \
             && ! grep -qvE '^(data/|README\.md$|full-list\.md$|CHANGELOG\.md$|VERSION$|\.github/ISSUE_TEMPLATE/|media/site-preview)' <<< "$files"; then
            echo "mode=--data-only" >> "$GITHUB_OUTPUT"
          fi
      - name: Rendering checks (every view at five widths and both themes, accessibility with axe-core, one browser per processor; data alone, see above)
        env:
          MODE: ${{ steps.scope.outputs.mode }}
        run: python3 scripts/check_site.py --json render.json ${MODE:+"$MODE"}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-findings
          path: render.json
          retention-days: 7
