<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{TAGLINE}}">
<link rel="alternate" hreflang="en" href="https://actarus314.github.io/awesome-lego/">
<link rel="alternate" hreflang="fr" href="https://actarus314.github.io/awesome-lego/fr/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='10' width='28' height='18' rx='3' fill='%23e3a008'/%3E%3Crect x='7' y='5' width='7' height='6' rx='2' fill='%23e3a008'/%3E%3Crect x='18' y='5' width='7' height='6' rx='2' fill='%23e3a008'/%3E%3C/svg%3E">
<script>try{const t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/* light: warm paper and brick red; dark: the maintainer's "Bleu" night palette (navy, cyan links, yellow highlights) */
:root{color-scheme:light dark;
--bg:light-dark(#f6f4ef,#071b2f);--card:light-dark(#ffffff,#0c2640);--sunk:light-dark(#eeebe3,#061627);--line:light-dark(#ddd8cc,#1f3d5b);
--fg:light-dark(#1d232a,#e9f2fb);--muted:light-dark(#4f5a65,#b3cbe3);--faint:light-dark(#85919d,#7f9cba);
--accent:light-dark(#b3261e,#7fd4ff);--on-accent:light-dark(#ffffff,#04192c);--hi:light-dark(#b3261e,#ffd166);
--official:light-dark(#c9302c,#ff8f8f);--alt:light-dark(#b86e00,#ffd166);--other:light-dark(#8a96a3,#6f8fae);
--seq:light-dark(#1f5f99,#7fd4ff);--ok:light-dark(#1f7a3e,#7ee8a6);--warn:light-dark(#a35d00,#ff9d7a);--bad:light-dark(#a3231b,#ff8f8f);
--grid:light-dark(transparent,rgba(255,255,255,.028));
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--r:12px;--maxw:1400px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:4.5rem}
body{margin:0;background-color:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
a{color:var(--accent)}a:hover{text-decoration-thickness:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(12px,3vw,32px)}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;color:var(--fg);text-decoration:none;white-space:nowrap}
.brand svg{width:30px;height:30px}
nav.tabs{display:flex;gap:4px;flex:1;overflow:hidden}
nav.tabs a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap}
nav.tabs a:hover{background:var(--sunk);color:var(--fg)}
.tools{display:flex;gap:6px;align-items:center}
.btn{height:34px;min-width:34px;padding:0 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;font:600 13px system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.pill{font:600 12px var(--mono);color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}.pill:hover{color:var(--fg);border-color:var(--muted)}
.hero{padding:42px 0 18px;display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end}
.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.1;margin:0 0 12px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);font-size:17px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font:750 28px/1.1 system-ui,sans-serif;font-variant-numeric:tabular-nums}
.label,.kpi span{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
h2{font-size:22px;margin:44px 0 6px;letter-spacing:-.01em;border-left:4px solid var(--hi);padding-left:.7rem}
.lead{color:var(--muted);margin:0 0 16px}
.map{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.tile{grid-column:span var(--span,3);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:150px}
.tile:hover,.tile.on{border-color:var(--accent)}.tile.on{box-shadow:0 0 0 2px var(--accent) inset}
.tile h3{margin:0;font-size:16px}.tile .n{font:750 30px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums}
.studs{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.stud{display:block;width:13px;height:13px;border-radius:50%;background:var(--other);border:0;padding:0;cursor:pointer;flex:none}
.stud:hover,.stud:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.stud.official{background:var(--official)}.stud.alternative{background:var(--alt)}.stud.both{background:linear-gradient(90deg,var(--official) 50%,var(--alt) 50%)}.stud.dim{opacity:.35}
.key{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-top:10px;align-items:center}
.key .stud{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;cursor:default}
.insights{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
#v-brands{grid-row:span 2}
@media (max-width:1180px){.insights{grid-template-columns:1fr}#v-brands{grid-row:auto}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.panel h3{margin:0 0 4px;font-size:17px}.panel .take{margin:0 0 14px;color:var(--fg);font-size:15px}
.panel .note{margin:12px 0 0;color:var(--muted);font-size:13px}
.heat{display:grid;gap:3px;font-size:13px;align-items:stretch}
.heat .h{font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);align-self:end;padding:0 0 4px;text-align:center;overflow-wrap:anywhere}
.heat .rn{padding:3px 8px 3px 0;color:var(--fg);overflow-wrap:anywhere;align-self:center}
.heat .c{border-radius:5px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;min-height:26px;border:0;cursor:pointer;font:600 13px system-ui,sans-serif;color:var(--fg)}
.heat .c.z{background:transparent;border:1px dashed var(--line);color:var(--faint);cursor:default;font-weight:400}
.heat .c:not(.z):hover{outline:2px solid var(--fg)}
.heat .sep{grid-column:1/-1;font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:10px 0 2px}
.dumb,.pulse{display:block;max-width:100%}
.dumb text,.pulse text{fill:var(--muted);font:13px system-ui,sans-serif}.dumb .v{fill:var(--fg);font-weight:650;font-variant-numeric:tabular-nums}.dumb .ax,.pulse .ax{fill:var(--faint);font-size:12px}
.bar{position:sticky;top:56px;z-index:10;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.bar .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{flex:1;min-width:220px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);padding:0 12px;font:15px system-ui,sans-serif}
.count{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.fam{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:start}
.fam>.label{padding-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:4px 10px;font:600 13px system-ui,sans-serif;cursor:pointer;max-width:100%;text-align:left}
.chip .c{color:var(--faint);font-variant-numeric:tabular-nums;margin-left:5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.chip.on .c{color:inherit;opacity:.8}
.fam.cov .chip{border-radius:999px}
.fam.opt .chip::before{content:"";display:inline-block;width:12px;height:12px;border:1.5px solid var(--muted);border-radius:3px;margin-right:7px;vertical-align:-1px}
.fam.opt .chip.on::before{background:var(--on-accent);border-color:var(--on-accent);box-shadow:inset 0 0 0 2px var(--accent)}
.cat{margin-top:26px}.cat>h3{font-size:19px;margin:0 0 4px}.cat>p{margin:0 0 12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--hi)}100%{box-shadow:0 0 0 3px transparent}}
.card .h{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.card .h a{font-weight:700;font-size:16px;text-decoration:none;color:var(--fg);min-width:0;overflow-wrap:anywhere}.card .h a:hover{color:var(--accent)}
.card .g{font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:right;max-width:55%}
.card .s{margin:0}.star{color:var(--alt)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font:600 11.5px system-ui,sans-serif;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.official{color:var(--official)}.tag.alternative{color:var(--alt)}.tag.st-slow,.tag.st-inactive,.tag.st-archived{color:var(--warn)}.tag.st-dead{color:var(--bad)}
details{border-top:1px solid var(--line);padding-top:6px}summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
details ul{margin:6px 0;padding-left:18px;font-size:13.5px}details li{margin:2px 0}
.plus li::marker{content:"＋ ";color:var(--ok)}.minus li::marker{content:"－ ";color:var(--bad)}
.src{font-size:12.5px;color:var(--muted)}.src a{margin-right:8px}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{margin:60px 0 0;padding:24px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:13px;max-width:300px;opacity:0;transition:opacity .08s}
@media (max-width:980px){.hero{grid-template-columns:1fr}.tile{grid-column:span 6 !important}nav.tabs{display:none}}
@media (max-width:640px){.tile{grid-column:span 12 !important}.kpi b{font-size:22px}.fam{grid-template-columns:1fr;gap:4px}.fam>.label{padding-top:0}.pill{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">

</div></header>
<main class="wrap" id="top">

(()=>{

const S={
short:{en:'Awesome LEGO',fr:'Awesome LEGO'},nav_map:{en:'Map',fr:'Carte'},nav_ins:{en:'Insights',fr:'Constats'},nav_dir:{en:'Directory',fr:'Annuaire'},

};

document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
const R=D.resources,C=D.categories,catName=id=>(C.find(c=>c.id===id)||{})[L]||id,shortCat=id=>catName(id).split(/[,(]/)[0].replace(/ (et|and) .*/,'');

const fold=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const world=r=>{const o=(r.covers||[]).includes('official'),a=(r.covers||[]).includes('alternative');return o&&a?'both':o?'official':a?'alternative':''};
const cname=(()=>{try{const n=new Intl.DisplayNames([L],{type:'region'});return c=>c==='international'?t('intl'):(n.of(c)||c)}catch(e){return c=>c}})();
document.getElementById('built').textContent=t('built')+' '+fmt(D.built);
const tb=document.getElementById('theme'),root=document.documentElement,ic=p=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">${p}</svg>`;

const tname={auto:{en:'Theme: auto',fr:'Thème : auto'},light:{en:'Theme: light',fr:'Thème : clair'},dark:{en:'Theme: dark',fr:'Thème : sombre'}};
const getT=()=>{try{return localStorage.getItem('theme')||'auto'}catch(e){return 'auto'}};
const setT=v=>{if(v==='auto')delete root.dataset.theme;else root.dataset.theme=v;tb.innerHTML=lab[v];tb.setAttribute('aria-label',tname[v][L]);try{localStorage.setItem('theme',v)}catch(e){}};
setT(getT());tb.onclick=()=>{const o=['auto','light','dark'];setT(o[(o.indexOf(getT())+1)%3])};
const tip=document.getElementById('tip');
const hideTip=()=>tip.style.opacity=0;addEventListener('scroll',hideTip,{passive:true});addEventListener('resize',hideTip);
document.addEventListener('mousemove',e=>{const el=e.target.closest('[data-tip]');if(!el){hideTip();return}tip.textContent=el.dataset.tip;tip.style.opacity=1;const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+12,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-12;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=x+'px';tip.style.top=y+'px'});
const active=R.filter(r=>r.status==='active').length,langs=new Set(R.flatMap(r=>r.languages||[]));
document.getElementById('kpis').innerHTML=[[R.length,t('resources')],[C.length,t('categories')],[Math.round(100*active/R.length)+' %',t('active')],[langs.size,t('languages')]].map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');
// search index: MiniSearch, fuzzy and prefix matching, results ranked by relevance
const brandName=id=>(D.brands.find(x=>x.id===id)||{}).name||'';
const ms=new MiniSearch({fields:['name','summary','strengths','weaknesses','group','covers','countries','size','brands'],storeFields:[],
 processTerm:w=>fold(w),searchOptions:{boost:{name:4,brands:3,group:2},prefix:true,fuzzy:0.2,combineWith:'AND'}});
ms.addAll(R.map(r=>({id:r.id,name:r.name,summary:r[L].summary,strengths:r[L].strengths.join(' '),weaknesses:r[L].weaknesses.join(' '),group:r[L].group,
 covers:(r.covers||[]).map(t).join(' '),countries:(r.countries||[]).map(cname).join(' '),size:r[L].size,brands:(r.brands||[]).map(brandName).join(' ')})));
const st={cat:null,cov:new Set(),active:false,fr:false,featured:false,q:''};
let hits=null;
const covers=['official','alternative','second-hand','parts','custom-builds','instructions','news','data'];
function match(r,skip){
 if(skip!=='cat'&&st.cat&&r.cat!==st.cat)return false;
 if(skip!=='cov'&&st.cov.size&&![...st.cov].every(c=>(r.covers||[]).includes(c)))return false;
 if(st.active&&r.status!=='active')return false;
 if(st.fr&&!(r.languages||[]).includes('fr'))return false;
 if(st.featured&&!r.featured)return false;
 if(hits&&!hits.has(r.id))return false;
 return true}
const fc=document.getElementById('f-cat'),fv=document.getElementById('f-cov'),fm=document.getElementById('f-misc'),q=document.getElementById('q');q.placeholder=t('search');
function drawFilters(){
 fc.innerHTML=C.map(c=>`<button class="chip${st.cat===c.id?' on':''}" data-cat="${c.id}" aria-pressed="${st.cat===c.id}">${esc(c[L])}<span class="c">${R.filter(r=>r.cat===c.id&&match(r,'cat')).length}</span></button>`).join('');
 fv.innerHTML=covers.map(c=>`<button class="chip${st.cov.has(c)?' on':''}" data-cov="${c}" aria-pressed="${st.cov.has(c)}">${t(c)}<span class="c">${R.filter(r=>(r.covers||[]).includes(c)&&match(r,'cov')).length}</span></button>`).join('');
 fm.innerHTML=[['featured',t('featured')],['active',t('only_active')],['fr',t('in_fr')]].map(([k,l])=>`<button class="chip${st[k]?' on':''}" data-m="${k}" aria-pressed="${st[k]}">${l}</button>`).join('')}
fc.onclick=e=>{const b=e.target.closest('[data-cat]');if(b){st.cat=st.cat===b.dataset.cat?null:b.dataset.cat;update()}};
fv.onclick=e=>{const b=e.target.closest('[data-cov]');if(b){const c=b.dataset.cov;st.cov.has(c)?st.cov.delete(c):st.cov.add(c);update()}};
fm.onclick=e=>{const b=e.target.closest('[data-m]');if(b){st[b.dataset.m]=!st[b.dataset.m];update()}};
function setQuery(v){st.q=v;q.value=v;const s=v.trim();hits=s?new Map(ms.search(s).map(h=>[h.id,h.score])):null}
q.oninput=()=>{setQuery(q.value);update(false)};
function resetAll(){st.cat=null;st.cov.clear();st.active=st.fr=st.featured=false;setQuery('')}
document.getElementById('reset').onclick=()=>{resetAll();update()};
function card(r,showCat){const x=r[L];const tags=[...(r.covers||[]).map(c=>`<span class="tag ${c}">${t(c)}</span>`),(r.status!=='active'?`<span class="tag st-${r.status}">${t('st_'+r.status)}</span>`:''),(r.languages||[]).length?`<span class="tag">${esc(r.languages.join(' · ').toUpperCase())}</span>`:'',r.access?`<span class="tag">${t(r.access)}</span>`:''].join('');
 const m=r.metrics||{};const extra=[x.size,m.stars!=null?'★ '+m.stars:'',x.model].filter(Boolean).map(esc).join(' · ');
 return `<article class="card" id="r-${r.id}"><div class="h"><a href="${esc(r.url)}" rel="noopener">${r.featured?'<span class="star" aria-hidden="true">★ </span>':''}${esc(r.name)}</a><span class="g">${esc(showCat?catName(r.cat):x.group)}</span></div><p class="s">${esc(x.summary)}</p>${extra?`<div class="src">${extra}</div>`:''}<div class="tags">${tags}</div>`+
 ((x.strengths.length||x.weaknesses.length)?`<details><summary>${t('strengths')} · ${t('weaknesses')}</summary>${x.strengths.length?`<ul class="plus">${x.strengths.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}${x.weaknesses.length?`<ul class="minus">${x.weaknesses.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}<div class="src">${t('sources')} : ${r.sources.map((s,i)=>`<a href="${esc(s.url)}" rel="noopener">${i+1}</a>`).join('')} · ${t('checked')} ${fmt(r.checked)}${r.last?' · ⟳ '+fmt(r.last):''}</div></details>`:'')+`</article>`}
function drawList(){const rs=R.filter(r=>match(r));document.getElementById('count').textContent=rs.length+' / '+R.length+' '+t('shown');const list=document.getElementById('list');
 if(!rs.length){list.innerHTML=`<div class="empty">${t('none')}</div>`;return}
 if(hits){rs.sort((a,b)=>hits.get(b.id)-hits.get(a.id));list.innerHTML=`<section class="cat"><h3>${t('ranked')} <span class="count">${rs.length}</span></h3><div class="grid">${rs.map(r=>card(r,true)).join('')}</div></section>`;return}
 list.innerHTML=C.map(c=>{const cr=rs.filter(r=>r.cat===c.id);if(!cr.length)return'';
  cr.sort((a,b)=>(c.groups.findIndex(g=>g.id===a.group)-c.groups.findIndex(g=>g.id===b.group))||a.name.localeCompare(b.name));
  return `<section class="cat"><h3>${esc(c[L])} <span class="count">${cr.length}</span></h3>${c.summary[L]?`<p>${esc(c.summary[L])}</p>`:''}<div class="grid">${cr.map(r=>card(r,false)).join('')}</div></section>`}).join('')}
function openEntry(id){resetAll();update();const el=document.getElementById('r-'+id);if(!el)return;const d=el.querySelector('details');if(d)d.open=true;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
function focusOn(cat,query){resetAll();st.cat=cat||null;setQuery(query||'');update();document.getElementById('directory').scrollIntoView({behavior:'smooth'})}
const mg=document.getElementById('mapgrid');
const spans=(()=>{const n=C.map(c=>R.filter(r=>r.cat===c.id).length),tot=n.reduce((a,b)=>a+b,0),raw=n.map(v=>Math.max(2,Math.round(24*v/tot)));const rows=[];let acc=[];for(const s of raw){if(acc.reduce((a,b)=>a+b,0)+s>12&&acc.length){rows.push(acc);acc=[]}acc.push(s)}if(acc.length)rows.push(acc);
 return rows.flatMap(r=>{const s=r.reduce((a,b)=>a+b,0),k=r.map(x=>Math.max(2,Math.round(x*12/s)));k[k.length-1]+=12-k.reduce((a,b)=>a+b,0);return k})})();
function drawMap(){mg.innerHTML=C.map((c,i)=>{const rs=R.filter(r=>r.cat===c.id);return `<div class="tile${st.cat===c.id?' on':''}" style="--span:${spans[i]}" data-cat="${c.id}"><span class="label">${esc(c.groups.filter(g=>rs.some(r=>r.group===g.id)).map(g=>g[L]).join(' · '))}</span><h3>${esc(c[L])}</h3><span class="n">${rs.length}</span><span class="studs">${rs.map(r=>`<button type="button" class="stud ${world(r)}${r.status==='active'?'':' dim'}" data-go="${r.id}" data-tip="${esc(r.name)}" aria-label="${esc(r.name)}"></button>`).join('')}</span></div>`}).join('')}
mg.onclick=e=>{const s=e.target.closest('[data-go]');if(s){openEntry(s.dataset.go);return}const b=e.target.closest('[data-cat]');if(!b)return;st.cat=st.cat===b.dataset.cat?null:b.dataset.cat;update();document.getElementById('directory').scrollIntoView({behavior:'smooth'})};
document.getElementById('mapkey').innerHTML=[['official',t('official')],['both',t('both')],['alternative',t('alternative')],['',t('otherw')],['official dim',t('dim')]].map(([c,n])=>`<span><i class="stud ${c}"></i>${n}</span>`).join('');
// insight 1: which listed resources name each alternative brand, by category
const IC=['shops','comparators','second-hand','community','video'];
function vBrands(){const el=document.getElementById('v-brands');
 const rows=D.brands.map(b=>{const v=IC.map(c=>R.filter(r=>r.cat===c&&(r.brands||[]).includes(b.id)).length);return{...b,v,tot:v.reduce((a,x)=>a+x,0)}}).sort((a,b)=>b.tot-a.tot||a.name.localeCompare(b.name));
 const seen=rows.filter(r=>r.tot),none=rows.filter(r=>!r.tot),max=Math.max(...seen.flatMap(r=>r.v),1);
 const noVoice=seen.filter(r=>r.v[0]>0&&r.v[3]===0&&r.v[4]===0);
 const take=L==='fr'?`${none.length} marques sur ${rows.length} ne sont citées par aucune autre fiche. ${noVoice.length} se vendent dans les boutiques recensées sans qu'aucune communauté ni chaîne vidéo n'en parle : ${noVoice.map(r=>r.name).join(', ')}.`
  :`${none.length} brands out of ${rows.length} are named by no other entry. ${noVoice.length} are sold in the listed shops with no community or video channel talking about them: ${noVoice.map(r=>r.name).join(', ')}.`;
 const cell=(r,i)=>r.v[i]?`<button type="button" class="c" style="background:color-mix(in srgb,var(--seq) ${Math.round(14+66*r.v[i]/max)}%,var(--card));${r.v[i]/max>.5?'color:var(--card)':''}" data-f="${IC[i]}|${esc(r.name)}" data-tip="${esc(r.name)} · ${esc(catName(IC[i]))} : ${r.v[i]}">${r.v[i]}</button>`:`<span class="c z" aria-label="0">·</span>`;
 el.innerHTML=`<h3>${t('b_title')}</h3><p class="take">${esc(take)}</p><div class="heat" style="grid-template-columns:minmax(76px,1.3fr) repeat(${IC.length},minmax(34px,1fr))"><span></span>${IC.map(c=>`<span class="h">${esc(shortCat(c))}</span>`).join('')}${seen.map(r=>`<span class="rn">${esc(r.name)}</span>${IC.map((_,i)=>cell(r,i)).join('')}`).join('')}${none.length?`<span class="sep">${t('b_none')}</span><span class="rn" style="grid-column:1/-1;white-space:normal;color:var(--muted)">${esc(none.map(r=>r.name).join(' · '))}</span>`:''}</div><p class="note">${t('b_note')}</p>`;
 el.onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;const[c,n]=b.dataset.f.split('|');focusOn(c,n)}}
// insight 2: share of entries in French, official LEGO against alternative brands (dumbbell)
function vFrench(){const el=document.getElementById('v-french');const cats=['shops','comparators','second-hand','community','video','tools'];
 const fr=x=>x.filter(r=>(r.languages||[]).includes('fr')).length,pct=(f,n)=>n?Math.round(100*f/n):0;
 const rows=cats.map(c=>{const o=R.filter(r=>r.cat===c&&(r.covers||[]).includes('official')),a=R.filter(r=>r.cat===c&&(r.covers||[]).includes('alternative'));return{c,on:o.length,of:fr(o),an:a.length,af:fr(a)}});
 const gaps=rows.filter(r=>r.an).map(r=>({...r,gap:pct(r.of,r.on)-pct(r.af,r.an)})).sort((a,b)=>b.gap-a.gap),g=gaps[0];
 const afr=rows.reduce((s,r)=>s+r.af,0),an=rows.reduce((s,r)=>s+r.an,0);
 const take=L==='fr'?`Hors marques, ${afr} des ${an} fiches qui couvrent les marques alternatives sont en français. Le plus grand écart avec le LEGO officiel : ${shortCat(g.c).toLowerCase()} (${pct(g.of,g.on)} % contre ${pct(g.af,g.an)} %).`
  :`Brands aside, ${afr} of the ${an} entries covering alternative brands are in French. The widest gap with official LEGO: ${shortCat(g.c).toLowerCase()} (${pct(g.of,g.on)} % against ${pct(g.af,g.an)} %).`;
 const W=Math.max(320,el.clientWidth-40),lw=Math.min(170,W*.32),x0=lw+14,x1=W-128,rh=36,H=rows.length*rh+30,X=p=>x0+(x1-x0)*p/100;
 let s=`<svg class="dumb" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('f_title'))}">`;
 [0,50,100].forEach(p=>s+=`<line x1="${X(p)}" x2="${X(p)}" y1="2" y2="${H-22}" stroke="var(--line)"/><text class="ax" x="${X(p)}" y="${H-6}" text-anchor="middle">${p} %</text>`);
 rows.forEach((r,i)=>{const y=16+i*rh,po=pct(r.of,r.on),pa=pct(r.af,r.an);
  s+=`<text x="${lw}" y="${y+5}" text-anchor="end">${esc(shortCat(r.c))}</text>`;
  if(r.an)s+=`<line x1="${X(pa)}" x2="${X(po)}" y1="${y}" y2="${y}" stroke="var(--faint)" stroke-width="2"/>`;
  s+=`<circle cx="${X(po)}" cy="${y}" r="8" fill="var(--official)" stroke="var(--card)" stroke-width="2" data-tip="${esc(t('official'))} : ${r.of} / ${r.on} (${po} %)"/>`;
  if(r.an)s+=`<circle cx="${X(pa)}" cy="${y}" r="8" fill="var(--alt)" stroke="var(--card)" stroke-width="2" data-tip="${esc(t('alternative'))} : ${r.af} / ${r.an} (${pa} %)"/>`;
  s+=`<text class="v" x="${x1+16}" y="${y+5}">${r.of}/${r.on} · ${r.an?r.af+'/'+r.an:'—'}</text>`});
 el.innerHTML=`<h3>${t('f_title')}</h3><p class="take">${esc(take)}</p>${s}</svg><div class="key"><span><i class="stud official"></i>${t('official')}</span><span><i class="stud alternative"></i>${t('alternative')}</span></div><p class="note">${t('f_note')}</p>`}
// insight 3: pulse, one dot per resource at its last activity date over two years
function vPulse(){const el=document.getElementById('v-pulse');const cats=C.map(c=>c.id),today=new Date(D.built),from=new Date(today);from.setMonth(from.getMonth()-24);
 const W=Math.max(320,el.clientWidth-40),lw=Math.min(170,W*.32),x0=lw+14,x1=W-14,rh=30,H=cats.length*rh+30,span=today-from,X=d=>x0+(x1-x0)*Math.max(0,Math.min(1,(d-from)/span));
 const six=new Date(today);six.setMonth(six.getMonth()-6);
 const old=R.filter(r=>r.last&&new Date(r.last)<six),nolast=R.filter(r=>!r.last).length;
 const top=Object.entries(old.reduce((a,r)=>(a[r.cat]=(a[r.cat]||0)+1,a),{})).sort((a,b)=>b[1]-a[1])[0];
 const take=L==='fr'?`${old.length} ressources n'ont montré aucun signe de vie depuis 6 mois${top?`, surtout parmi les ${shortCat(top[0]).toLowerCase()} (${top[1]})`:''} ; ${nolast} n'ont pas de date observable.`
  :`${old.length} resources have shown no sign of life for 6 months${top?`, mostly among ${shortCat(top[0]).toLowerCase()} (${top[1]})`:''}; ${nolast} have no observable date.`;
 let s=`<svg class="pulse" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('p_title'))}">`;
 const xs=X(six);s+=`<rect x="${x0}" y="2" width="${xs-x0}" height="${H-26}" fill="var(--sunk)"/><line x1="${xs}" x2="${xs}" y1="2" y2="${H-24}" stroke="var(--warn)" stroke-dasharray="3 3"/>`;
 for(let k=0;k<=24;k+=6){const d=new Date(from);d.setMonth(d.getMonth()+k);s+=`<text class="ax" x="${X(d)}" y="${H-6}" text-anchor="middle">${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(2)}</text>`}
 cats.forEach((c,i)=>{const y=14+i*rh;s+=`<text x="${lw}" y="${y+5}" text-anchor="end">${esc(shortCat(c))}</text>`;
  R.filter(r=>r.cat===c&&r.last).forEach((r,j)=>{const d=new Date(r.last),x=X(d),dy=((j%3)-1)*6;s+=`<circle cx="${x}" cy="${y+dy}" r="5" ${d<six?'fill="var(--card)" stroke="var(--warn)" stroke-width="2.5"':'fill="var(--other)" stroke="var(--card)" stroke-width="1.5"'} data-go="${r.id}" data-tip="${esc(r.name)} · ${fmt(r.last)}" style="cursor:pointer"/>`})});
 el.innerHTML=`<h3>${t('p_title')}</h3><p class="take">${esc(take)}</p>${s}</svg><p class="note">${t('p_note')}</p>`;
 el.onclick=e=>{const p=e.target.closest('[data-go]');if(p)openEntry(p.dataset.go)}}
function drawInsights(){vBrands();vFrench();vPulse()}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{vFrench();vPulse()},150)});
function update(all=true){drawFilters();drawList();if(all)drawMap()}
update();drawInsights();
})();
</script>
