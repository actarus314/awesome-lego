<style>
/* light: "Bleu jour", day counterpart of the night palette (pale blue grid, navy text, blue interface), official LEGO brick red against alternative amber; dark: "Bleu" night palette (navy, cyan links, yellow highlights) */
:root{color-scheme:light dark;
--bg:light-dark(#eaf2fa,#071b2f);--card:light-dark(#ffffff,#0c2640);--sunk:light-dark(#dfeaf5,#061627);--line:light-dark(#c9d9ea,#1f3d5b);
--fg:light-dark(#0c2640,#e9f2fb);--muted:light-dark(#3d5875,#b3cbe3);--faint:light-dark(#6f8aa6,#7f9cba);
--accent:light-dark(#0a6aa1,#7fd4ff);--on-accent:light-dark(#ffffff,#04192c);--hi:light-dark(#e3a008,#ffd166);
--official:light-dark(#b8453a,#ff8f8f);--alt:light-dark(#d9a21b,#ffd166);--alt-ink:light-dark(#8a6400,#ffd166);--other:light-dark(#7a8692,#6f8fae);
--seq:light-dark(#0a6aa1,#7fd4ff);--f-cat:light-dark(#0a6aa1,#7fd4ff);--f-cov:light-dark(#0f6b5c,#c3b5ff);--f-opt:light-dark(#3b4651,#7ee8a6);--ok:light-dark(#1f7a3e,#7ee8a6);--warn:light-dark(#a35d00,#ff9d7a);--bad:light-dark(#a3231b,#ff8f8f);
--grid:light-dark(rgba(12,38,64,.045),rgba(255,255,255,.028));
--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--r:12px;--maxw:1400px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:4.5rem}
body{margin:0;background-color:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
a{color:var(--accent)}a:hover{text-decoration-thickness:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(12px,3vw,32px)}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;color:var(--fg);text-decoration:none;white-space:nowrap}
.brand svg{width:30px;height:30px}
nav.tabs{display:flex;gap:4px;flex:1;overflow:hidden}
nav.tabs a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap}
nav.tabs a:hover{background:var(--sunk);color:var(--fg)}
nav.tabs a[aria-current=page]{color:var(--fg);box-shadow:inset 0 -2px 0 var(--hi);border-radius:0}
[hidden]{display:none !important}
.tools{display:flex;gap:6px;align-items:center}
.btn{height:34px;min-width:34px;padding:0 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;font:600 13px system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.pill{font:600 12px var(--mono);color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}.pill:hover{color:var(--fg);border-color:var(--muted)}
.hero{padding:28px 0 8px;display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start}
.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.05;margin:0 0 10px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);font-size:17px}.hero .fresh{margin-top:12px;font:600 12px var(--mono);letter-spacing:.04em;color:var(--faint)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font:750 28px/1.1 system-ui,sans-serif;font-variant-numeric:tabular-nums}
.label,.kpi span{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
h2{font-size:22px;margin:44px 0 6px;letter-spacing:-.01em;border-left:4px solid var(--hi);padding-left:.7rem}
.lead{color:var(--muted);margin:0 0 16px}
.map{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.tile{grid-column:span var(--span,3);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:120px}
.tile:hover,.tile.on{border-color:var(--accent)}.tile.on{box-shadow:0 0 0 2px var(--accent) inset}
.ci{width:22px;height:22px;vertical-align:-4px;margin-right:9px;border-radius:5px}
.tile h3{margin:0;font-size:16px}.tile .n{font:750 30px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums}
.studs{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.stud{display:block;width:13px;height:13px;border-radius:50%;background:var(--other);border:0;padding:0;cursor:pointer;flex:none}
.stud:hover,.stud:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.stud.official{background:var(--official)}.stud.alternative{background:var(--alt)}.stud.both{background:linear-gradient(90deg,var(--official) 50%,var(--alt) 50%)}.stud.dim{opacity:.35}
.key{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-top:10px;align-items:center}
.key .stud{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;cursor:default}
.insights{columns:2;column-gap:14px}.insights>.panel{break-inside:avoid;margin-bottom:14px;display:block}
@media (max-width:1180px){.insights{columns:1}}
.panel.wide{column-span:all}
.passion{display:block;max-width:100%}.passion text{fill:var(--muted);font:13px system-ui,sans-serif}.passion .ax{fill:var(--faint);font-size:12px}.passion .lb{fill:var(--fg);font-size:12px}
#f-country{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:4px 8px;font:600 13px system-ui,sans-serif;max-width:100%}
#f-country.on{border-color:var(--f-opt);box-shadow:inset 0 0 0 1px var(--f-opt)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.panel h3{margin:0 0 4px;font-size:17px}.panel .take{margin:0 0 14px;color:var(--fg);font-size:15px}
.panel .note{margin:12px 0 0;color:var(--muted);font-size:13px}
.heat{display:grid;gap:3px;font-size:13px;align-items:stretch}
.heat .h{font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);align-self:end;padding:0 0 4px;text-align:center;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:normal;word-break:normal}
@media (max-width:640px){.heat .h{letter-spacing:0;font-size:10px}}
.heat .rn{padding:3px 8px 3px 0;color:var(--fg);overflow-wrap:anywhere;align-self:center}
.heat .c{border-radius:5px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;min-height:26px;border:0;cursor:pointer;font:600 13px system-ui,sans-serif;color:var(--fg)}
.heat .c.z{background:transparent;border:1px dashed var(--line);color:var(--faint);cursor:default;font-weight:400}
.heat .c:not(.z):hover{outline:2px solid var(--fg)}
.heat .sep{grid-column:1/-1;font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:10px 0 2px}
.dumb,.pulse{display:block;max-width:100%}
.dumb text,.pulse text{fill:var(--muted);font:13px system-ui,sans-serif}.dumb .v{fill:var(--fg);font-weight:650;font-variant-numeric:tabular-nums}.dumb .ax,.pulse .ax{fill:var(--faint);font-size:12px}
.bar{position:sticky;top:56px;z-index:10;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.bar .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{flex:1;min-width:220px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);padding:0 12px;font:15px system-ui,sans-serif}
.count{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.fam{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:start}
.fam>.label{padding-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:4px 10px;font:600 13px system-ui,sans-serif;cursor:pointer;max-width:100%;text-align:left}
.chip .c{color:var(--faint);font-variant-numeric:tabular-nums;margin-left:5px}
.fam{--f:var(--f-cat)}.fam.cov{--f:var(--f-cov)}.fam.opt{--f:var(--f-opt)}
.fam>.label{color:var(--f)}.fam>.label::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--f);margin-right:6px;vertical-align:1px}
.chip:hover{border-color:var(--f)}
.chip.on{background:var(--f);border-color:var(--f);color:var(--on-accent)}.chip.on .c{color:inherit;opacity:.8}
.fam.cov .chip{border-radius:999px}
.fam.opt .chip::before{content:"";display:inline-block;width:12px;height:12px;border:1.5px solid var(--muted);border-radius:3px;margin-right:7px;vertical-align:-1px}
.fam.opt .chip.on::before{background:var(--on-accent);border-color:var(--on-accent);box-shadow:inset 0 0 0 2px var(--f)}
.journeys{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:10px}
.jr{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.jr h3{margin:0 0 6px;font-size:15px}.jr ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 12px}
.jr a{font-weight:600;text-decoration:none}.jr a:hover{text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--muted);font:600 13px system-ui,sans-serif;padding:0 12px;height:34px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
table.dt{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--r);font-size:13.5px;margin-top:14px}
.dt th{position:sticky;top:var(--bar-h,190px);background:var(--card);text-align:left;font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
.dt th[aria-sort=ascending]::after{content:" ▲"}.dt th[aria-sort=descending]::after{content:" ▼"}
.dt td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}.dt tr:hover td{background:var(--sunk)}
.dt td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.dt a{font-weight:600;text-decoration:none;color:var(--fg)}
@media (max-width:900px){.dt .opt{display:none}}
.cat{margin-top:26px}.cat>h3{font-size:19px;margin:0 0 10px;display:flex;align-items:center;gap:0}.cat>h3 .count{margin-left:12px;font:600 12px var(--mono);color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:1px 9px}.cat>p{margin:0 0 12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.card{scroll-margin-top:calc(var(--bar-h,250px) + 12px)}.card.focus{border-color:var(--hi);box-shadow:0 0 0 3px var(--hi),0 10px 28px -12px rgba(0,0,0,.35);background:color-mix(in srgb,var(--hi) 7%,var(--card));animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.card.focus{animation:none}}
.card .h{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.card .h a{font-weight:700;font-size:16px;text-decoration:none;color:var(--fg);min-width:0;overflow-wrap:anywhere}.card .h a:hover{color:var(--accent)}
.card .g{font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:right;max-width:55%}
.card .s{margin:0}.star{color:var(--hi)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font:600 11.5px system-ui,sans-serif;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.official{color:var(--official)}.tag.alternative{color:var(--alt-ink)}.tag.st-slow,.tag.st-inactive,.tag.st-archived{color:var(--warn)}.tag.st-dead{color:var(--bad)}
details{border-top:1px solid var(--line);padding-top:6px}summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
details ul{margin:6px 0;padding-left:18px;font-size:13.5px}details li{margin:2px 0}
.plus li::marker{content:"＋ ";color:var(--ok)}.minus li::marker{content:"－ ";color:var(--bad)}
.src{font-size:12.5px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{margin:60px 0 0;padding:24px 0 40px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:13px;max-width:300px;opacity:0;transition:opacity .08s}
@media (max-width:980px){.hero{grid-template-columns:1fr}.tile{grid-column:span 6 !important}}
#fams{display:flex;flex-direction:column;gap:8px}#ftoggle,#reset2{display:none}
@media (max-width:640px){#ftoggle{display:inline-flex}#fams{display:none;max-height:62vh;overflow:auto;padding-bottom:4px}.bar.open #fams{display:flex}#ftoggle[aria-expanded=true]{border-color:var(--accent);color:var(--accent)}.bar input[type=search]{min-width:0;flex-basis:100%}#reset,.count .cw{display:none}#reset2{display:inline-flex;align-self:flex-start}.bar .row{gap:6px}}
@media (max-width:640px){.brand span{display:none}header.top .wrap{gap:8px}nav.tabs a{padding:6px 7px}.tools .btn{padding:0 7px}.tile{grid-column:span 12 !important}.kpi b{font-size:22px}.fam{grid-template-columns:1fr;gap:4px}.fam>.label{padding-top:0}.pill{display:none}}
</style>
</head>

const S={
short:{en:'Awesome LEGO',fr:'Awesome LEGO'},nav_ins:{en:'Findings',fr:'Constats'},nav_dir:{en:'Directory',fr:'Annuaire'},

// insight 2: pulse. Dormant resources (no activity for 6 months) one by one; the active ones counted per category
function vPulse(){const el=document.getElementById('v-pulse');const cats=C.map(c=>c.id),today=new Date(D.built),from=new Date(today);from.setMonth(from.getMonth()-24);
 const six=new Date(today);six.setMonth(six.getMonth()-6);
 const W=Math.max(300,el.clientWidth-40),lw=Math.min(170,W*.36),cut=v=>v.length*7.6>lw?v.slice(0,Math.max(4,Math.floor(lw/7.6)-1))+'…':v,x0=lw+14,x1=W-90,xs=Math.min(x0+(W-x0-90)*0.82,x1-70),rh=34,H=cats.length*rh+30,X=d=>x0+(xs-x0)*Math.max(0,Math.min(1,(d-from)/(six-from)));
 const old=R.filter(r=>r.last&&new Date(r.last)<six),nolast=R.filter(r=>!r.last).length;
 const top=Object.entries(old.reduce((a,r)=>(a[r.cat]=(a[r.cat]||0)+1,a),{})).sort((a,b)=>b[1]-a[1])[0];
 const take=L==='fr'?`${old.length} ressources n'ont montré aucun signe de vie depuis 6 mois${top?`, surtout dans « ${catName(top[0])} » (${top[1]})`:''} ; ${nolast} n'ont pas de date observable.`
  :`${old.length} resources have shown no sign of life for 6 months${top?`, mostly in "${catName(top[0])}" (${top[1]})`:''}; ${nolast} have no observable date.`;
 let s=`<svg class="pulse" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('p_title'))}">`;
 s+=`<rect x="${xs}" y="2" width="${x1-xs}" height="${H-26}" fill="var(--sunk)" rx="4"/><text class="ax" x="${(xs+x1)/2}" y="${H-6}" text-anchor="middle">${t('p_recent')}</text>`;
 for(const k of (W<520?[0]:[0,6,12])){const d=new Date(from);d.setMonth(d.getMonth()+k);s+=`<text class="ax" x="${X(d)}" y="${H-6}" text-anchor="${k?'middle':'start'}">${k?'':'≤ '}${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(2)}</text>`}
 cats.forEach((c,i)=>{const y=14+i*rh,rs=R.filter(r=>r.cat===c&&r.last);s+=`<text x="${lw}" y="${y+5}" text-anchor="end">${esc(cut(shortCat(c)))}</text><line x1="${x0}" x2="${xs}" y1="${y}" y2="${y}" stroke="var(--line)"/>`;
  const placed=[],old2=rs.filter(r=>new Date(r.last)<from);
  if(old2.length){s+=`<circle cx="${x0}" cy="${y}" r="${old2.length>1?9:5.5}" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5" data-go="${old2[0].id}" data-tip="${esc(old2.map(r=>r.name+' · '+fmt(r.last)).join(' ; '))}" style="cursor:pointer"/>`+(old2.length>1?`<text x="${x0}" y="${y+4}" text-anchor="middle" style="font-size:10px;font-weight:700;fill:var(--warn);pointer-events:none">${old2.length}</text>`:'');placed.push({x:x0,dy:0})}
  rs.filter(r=>new Date(r.last)<six&&new Date(r.last)>=from).sort((a,b)=>a.last<b.last?-1:1).forEach(r=>{const x=X(new Date(r.last));let dy=0;for(const k of [0,-9,9,-18,18]){if(!placed.some(p=>Math.abs(p.x-x)<10&&p.dy===k)){dy=k;break}}placed.push({x,dy});
   s+=`<circle cx="${x}" cy="${y+dy}" r="5.5" fill="var(--card)" stroke="var(--warn)" stroke-width="2.5" data-go="${r.id}" data-tip="${esc(r.name)} · ${fmt(r.last)}" style="cursor:pointer"/>`});
  const n=rs.filter(r=>new Date(r.last)>=six).length,bw=(x1-xs-30)*n/Math.max(1,...cats.map(cc=>R.filter(r=>r.cat===cc&&r.last&&new Date(r.last)>=six).length));
  s+=`<rect x="${xs+6}" y="${y-6}" width="${bw}" height="12" rx="3" fill="var(--other)" data-tip="${esc(shortCat(c))} · ${n}"/><text class="ax" x="${xs+10+bw}" y="${y+4}">${n}</text>`});
 el.innerHTML=`<h3>${t('p_title')}</h3><p class="take">${esc(take)}</p>${s}</svg><p class="note">${t('p_note')}</p>`;
 el.onclick=e=>{const p=e.target.closest('[data-go]');if(p)openEntry(p.dataset.go)}}
// insight 3: recognized fan communities against population, by country (backend data)
function vPassion(){const el=document.getElementById('v-passion'),P=D.passion;if(!el)return;if(!P){el.remove();return}
 const rows=P.rows.filter(r=>r.pop),nopop=P.rows.filter(r=>!r.pop),avg=rows.reduce((a,r)=>a+r.n,0)/rows.reduce((a,r)=>a+r.pop,0);
 const has=new Set(CTRY.map(c=>c[0])),f=x=>x.toFixed(1),lg=Math.log10;
 const rated=rows.map(r=>({...r,k:r.n/r.pop/avg}));
 const top=rated.filter(r=>r.n>=3).sort((a,b)=>b.k-a.k).slice(0,3),low=rated.filter(r=>r.pop>=4e7&&r.k<1).sort((a,b)=>a.k-b.k);
 const list=a=>a.map(r=>`${cname(r.c)} (×${f(r.k)})`).join(', ');
 const take=L==='fr'?`Rapportés à leur population, ${list(top)} comptent le plus de communautés de fans reconnues. ${low.length} grands pays restent sous la moyenne : ${low.map(r=>cname(r.c)).join(', ')}.`
  :`Relative to population, ${list(top)} have the most recognized fan communities. ${low.length} large countries stay below the average: ${low.map(r=>cname(r.c)).join(', ')}.`;
 const W=Math.max(320,el.clientWidth-40),H=Math.min(420,Math.max(280,W*.42)),ml=44,mr=16,mt=10,mb=40;
 const X=v=>ml+(W-ml-mr)*(lg(v)-lg(3e5))/(lg(5e8)-lg(3e5)),Y=v=>mt+(H-mt-mb)*(1-(Math.log2(v)-Math.log2(.8))/(Math.log2(80)-Math.log2(.8)));
 let s=`<svg class="passion" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('pa_title'))}"><defs><clipPath id="pc"><rect x="${ml}" y="${mt}" width="${W-ml-mr}" height="${H-mt-mb}"/></clipPath></defs>`;
 for(const v of [1e6,1e7,1e8])s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${mt}" y2="${H-mb}" stroke="var(--line)"/><text class="ax" x="${X(v)}" y="${H-mb+16}" text-anchor="middle">${v/1e6} M</text>`;
 for(const v of [1,2,5,10,20,50])s+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text class="ax" x="${ml-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
 s+=`<text class="ax" x="${W-mr}" y="${H-4}" text-anchor="end">${t('pa_pop')} →</text><text class="ax" x="${ml}" y="${mt+12}" dx="6">↑ ${t('pa_n')}</text>`;
 s+=`<line clip-path="url(#pc)" x1="${X(3e5)}" y1="${Y(avg*3e5)}" x2="${X(5e8)}" y2="${Y(avg*5e8)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
 const placed=[],boxes=[],lab=[];
 rated.sort((a,b)=>b.n-a.n||b.pop-a.pop).forEach(r=>{const x=X(r.pop);let y=Y(r.n);for(const k of [0,-7,7,-14,14]){if(!placed.some(p=>Math.abs(p.x-x)<9&&Math.abs(p.y-(y+k))<9)){y+=k;break}}placed.push({x,y});
  const go=has.has(r.c);s+=`<circle cx="${x}" cy="${y}" r="5.5" fill="${r.k>=1?'var(--accent)':'var(--other)'}" stroke="var(--card)" stroke-width="2"${go?` data-c="${r.c}" style="cursor:pointer"`:''} data-tip="${esc(cname(r.c))} · ${r.n} · ×${f(r.k)}"/>`;
  if(r.n>=(W<600?10:3))lab.push({r,x,y})});
 const hit=(bx,by,w)=>boxes.some(b=>bx<b.x+b.w&&bx+w>b.x&&by<b.y+13&&by+13>b.y)||placed.some(p=>p.x+6>bx&&p.x-6<bx+w&&p.y+6>by&&p.y-6<by+13);
 lab.forEach(({r,x,y})=>{const w=cname(r.c).length*6.8;for(const [dx,dy,a] of [[9,4,'start'],[-9,4,'end'],[0,-10,'middle'],[0,19,'middle'],[9,-9,'start'],[-9,-9,'end'],[9,17,'start'],[-9,17,'end']]){const bx=a==='start'?x+dx:a==='end'?x+dx-w:x-w/2,by=y+dy-11;if(bx<ml||bx+w>W-mr||by<mt)continue;if(!hit(bx,by,w)){boxes.push({x:bx,y:by,w});s+=`<text class="lb" x="${x+dx}" y="${y+dy}" text-anchor="${a}">${esc(cname(r.c))}</text>`;break}}});
 const xn=nopop.length?t('pa_nopop')+nopop.map(r=>`${cname(r.c)} (${r.n})`).join(', ')+'.':'';
 el.innerHTML=`<h3>${t('pa_title')}</h3><p class="take">${esc(take)}</p>${s}</svg><p class="note">${esc(t('pa_note').replace('{d}',fmt(P.date)).replace('{y}',P.pop_year).replace('{x}',xn))}</p>`;
 el.onclick=e=>{const p=e.target.closest('[data-c]');if(!p)return;toDir();resetAll();st.country=p.dataset.c;update();document.getElementById('directory').scrollIntoView({behavior:'smooth'})}}
let drawn=false;function drawInsights(){vPassion();vBrands();vPulse();drawn=true}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!vi.hidden){vPulse();vPassion()}},150)});
// two views: directory (map and list) and findings; the address keeps the view
const vd=document.getElementById('view-dir'),vi=document.getElementById('view-ins');
function show(view){const ins=view==='ins';vd.hidden=ins;vi.hidden=!ins;document.querySelectorAll('nav.tabs a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.view===view)&&a.setAttribute('aria-current','page'));if(ins&&!drawn)drawInsights();else if(ins){vPulse();vPassion()}}
document.querySelector('nav.tabs a[data-view=dir]').onclick=e=>{e.preventDefault();toDir();writeHash();document.getElementById('map').scrollIntoView({behavior:'smooth'})};
addEventListener('hashchange',()=>{if(location.hash==='#findings')show('ins');else if(!vd.hidden===false)show('dir')});
function writeHash(){if(location.hash==='#findings')return;const p=new URLSearchParams();if(st.q.trim())p.set('q',st.q.trim());if(st.cat.size)p.set('cat',[...st.cat].join(','));if(st.cov.size)p.set('scope',[...st.cov].join(','));const cr=['featured','active','fr'].filter(k=>st[k]);if(cr.length)p.set('crit',cr.join(','));if(st.country)p.set('country',st.country);if(st.view!=='cards')p.set('view',st.view);const h=p.toString();history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}
function readHash(){const h=location.hash.slice(1);if(!h||h==='findings')return;const p=new URLSearchParams(h);(p.get('cat')||'').split(',').filter(Boolean).forEach(c=>st.cat.add(c));(p.get('scope')||'').split(',').filter(Boolean).forEach(c=>st.cov.add(c));(p.get('crit')||'').split(',').forEach(k=>{if(k in st&&typeof st[k]==='boolean')st[k]=true});if(p.get('country'))st.country=p.get('country');if(p.get('view')==='table')st.view='table';if(p.get('q'))setQuery(p.get('q'))}
const ft=document.getElementById('ftoggle'),bar=document.querySelector('.bar');
ft.onclick=()=>{const o=bar.classList.toggle('open');ft.setAttribute('aria-expanded',o)};
function nActive(){return st.cat.size+st.cov.size+['featured','active','fr'].filter(k=>st[k]).length+(st.country?1:0)}
function update(all=true){const n=nActive();ft.textContent=t('filters')+(n?` (${n})`:'');drawFilters();drawList();if(all)drawMap();writeHash()}
document.getElementById('journeys').innerHTML=(D.journeys||[]).map(j=>`<div class="jr"><h3>${esc(j['title_'+L])}</h3><ul>${j.resources.map(id=>R.find(r=>r.id===id)).filter(Boolean).map(r=>`<li><a href="#" data-go="${r.id}">${esc(r.name)}</a></li>`).join('')}</ul></div>`).join('');
document.getElementById('journeys').onclick=e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();openEntry(a.dataset.go)}};
const landing=new URLSearchParams(location.hash.slice(1)).get('entry');  // #entry=<id>: a link to one entry (feed, outside pages)
readHash();update();show(location.hash==='#findings'?'ins':'dir');if(landing)openEntry(landing);
})();
</script>
