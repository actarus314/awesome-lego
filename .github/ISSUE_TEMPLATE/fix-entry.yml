name: Fix an entry
description: Broken link, outdated or wrong information
title: "Fix: "
labels: ["correction"]
body:
  - type: input
    id: entry
    attributes:
      label: Entry name
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong, and the correct information
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source (link)
      placeholder: https://
