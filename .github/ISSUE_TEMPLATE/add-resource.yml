name: Add a resource
description: Suggest a website, shop, brand, channel, community or tool
title: "Add: "
labels: ["new resource"]
body:
  - type: input
    id: url
    attributes:
      label: Address
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Brands
        - Shops
        - Price comparators and set databases
        - Second-hand, parts and services
        - Communities and media
        - Videos and podcasts
        - Tools, data and open source
        - Directories
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it is and why it belongs here
      description: Facts, with a link that supports them
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Not already in the list
          required: true
        - label: No affiliate or referral link
          required: true
