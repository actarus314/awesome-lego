name: Data report
on:
  schedule:
    - cron: "41 3 4 * *"   # monthly, the 4th: the day before the monthly review
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # reading the activity data: about 4 minutes
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Previous report and links issue (the guard line and the links that block GitHub)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue list --label automatic --state all --search "Monthly data report in:title" --limit 1 --json body -q '.[].body' > previous.md   # open or closed
          gh issue list --label links --state all --limit 1 --json body -q '.[].body' > links.md
      - name: Read activity data and write the report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/refresh.py --month --previous previous.md --links links.md > report.md
          echo >> report.md
          python3 scripts/trends.py >> report.md || echo "Trends: the history branch could not be read this month." >> report.md   # never loses the rest of the report
          python3 -c "import pathlib; p = pathlib.Path('report.md'); t = p.read_text(encoding='utf-8'); p.write_text(t if len(t) <= 65000 else t[:65000].rsplit(chr(10), 1)[0] + chr(10) + '(cut: too long for an issue)' + chr(10), encoding='utf-8')"   # an issue body holds 65536 characters
      - name: Open or update the report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=$(gh issue list --label automatic --state open --search "Monthly data report in:title" --limit 1 --json number -q '.[].number')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file report.md; else gh issue create --title "Monthly data report" --label automatic --body-file report.md; fi   # a closed report stays closed: a new one opens
